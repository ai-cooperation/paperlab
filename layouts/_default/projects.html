{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-10">

  <header class="mb-8">
    <h1 class="text-3xl font-black text-primary mb-2">我的研究專案</h1>
    <p class="text-gray-600 text-lg leading-relaxed">
      你發想的研究提案，以及送進 pipeline 後的執行進度。提案送出後 a 段會非同步跑完整論文，這裡看狀態。
    </p>
  </header>

  <div id="pj-loading" class="text-gray-400 py-10">載入中…</div>

  <!-- Not logged in -->
  <div id="pj-guest" class="hidden">
    <div class="bg-tip border-l-4 border-secondary rounded-r-lg p-6">
      <h2 class="text-xl font-bold text-primary mb-2">先登入</h2>
      <p class="text-gray-700 mb-4">用 Google 登入後即可看到你自己的研究專案與進度。</p>
      <button onclick="window.paperLabAuth.login()" class="px-5 py-2.5 rounded-lg bg-accent text-primary-dark font-bold hover:bg-accent-dark transition">Google 登入</button>
    </div>
  </div>

  <!-- Logged in -->
  <div id="pj-app" class="hidden">
    <div id="pj-error" class="hidden p-4 rounded-lg bg-red-50 text-red-700 text-base mb-4"></div>
    <div class="flex justify-end mb-3">
      <button onclick="PJ.load()" class="text-sm px-3 py-1.5 rounded-lg border border-gray-300 hover:border-secondary hover:text-secondary transition">重新整理</button>
    </div>
    <div id="pj-list" class="space-y-4"></div>
    <div id="pj-empty" class="hidden text-gray-400 py-10 text-center">
      還沒有專案。到 <a href="/mcp/" class="text-secondary underline">MCP 連線設定</a> 接上 chat.ai，說「我想研究 X」開始發想第一個研究題目。
    </div>
    <section id="pj-admin" class="hidden mt-10 pt-8 border-t border-gray-300">
      <h2 class="text-2xl font-black text-primary mb-2">客製實驗人工評估</h2>
      <p class="text-gray-600 mb-5">這裡的決定只記錄是否接受人工評估，不會自動重啟原始 job。</p>
      <div id="pj-admin-list" class="space-y-4"></div>
      <div id="pj-admin-empty" class="hidden text-gray-400 py-5">目前沒有等待評估的客製實驗。</div>
    </section>
  </div>
</div>

<script>
const PJ = (() => {
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const BADGE = { ready:'bg-gray-100 text-gray-600', pending_sync:'bg-blue-100 text-blue-700', submitted:'bg-blue-100 text-blue-700', executing:'bg-amber-100 text-amber-700', running:'bg-amber-100 text-amber-700', human_review_required:'bg-amber-100 text-amber-800', needs_custom_experiment:'bg-red-100 text-red-800', done:'bg-green-100 text-green-700', blocked:'bg-red-100 text-red-700', error:'bg-red-100 text-red-700' };
  const LABEL = { ready:'已存草稿（未送出）', pending_sync:'已送出（同步中）', submitted:'已送出', executing:'執行中', running:'執行中', human_review_required:'等待人工核准', needs_custom_experiment:'需要人工評估', done:'完成', blocked:'卡住', error:'錯誤' };
  const CUSTOM_LABEL = { pending:'等待管理員評估', accepted_for_manual_assessment:'已接受人工評估', declined:'不受理' };

  async function load() {
    try {
      const resp = await window.paperLab.apiFetch('/api/projects');
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);
      const { projects } = await resp.json();
      show('pj-error', false);
      if (!projects || !projects.length) { $('pj-list').innerHTML = ''; show('pj-empty', true); return; }
      show('pj-empty', false);
      $('pj-list').innerHTML = projects.map((p) => {
        const st = p.status || 'ready';
        const badge = BADGE[st] || BADGE.ready;
        const statusLink = p.pipeline_status_url ? `<a href="/project/?status=${encodeURIComponent(p.pipeline_status_url)}" class="text-secondary underline">查即時進度</a>` : '';
        const isV3 = /\/v3\/jobs\/[^/]+\/status\/?$/.test(String(p.pipeline_status_url || ''));
        const hasPaperRoute = /\/(v2\/jobs|jobs)\/[^/]+\/status\/?$/.test(String(p.pipeline_status_url || ''));
        const paperLink = (st === 'done' && isV3)
          ? `<a href="/project/?status=${encodeURIComponent(p.pipeline_status_url)}" class="text-green-700 font-bold underline">下載論文 PDF</a>`
          : (st === 'done' && hasPaperRoute)
            ? `<a href="${esc(p.pipeline_status_url).replace(/\/status\/?$/, '/paper')}" target="_blank" rel="noreferrer" class="text-green-700 font-bold underline">下載論文 PDF</a>`
            : '';
        return `<div class="bg-white border border-gray-200 rounded-xl p-5">
          <div class="flex items-start justify-between gap-3 mb-2">
            <h3 class="font-bold text-primary flex-1 leading-snug">${esc(p.topic || p.id)}</h3>
            <span class="px-2.5 py-1 rounded-full text-xs font-bold whitespace-nowrap ${badge}">${LABEL[st] || st}</span>
          </div>
          <div class="text-xs text-gray-400 mb-3 font-mono">${esc(p.id)}</div>
          <div class="flex flex-wrap gap-4 text-sm items-center">
            ${paperLink}${statusLink}
            ${st === 'ready' ? '<span class="text-gray-400">尚未送進 pipeline（在 chat.ai 說「送進 pipeline」觸發）</span>' : ''}
            ${st === 'needs_custom_experiment' ? `<span class="text-red-700">${esc(CUSTOM_LABEL[p.custom_experiment_state || 'pending'])}；原始流程已停止，未自動重啟。</span>` : ''}
          </div>
        </div>`;
      }).join('');
    } catch (e) { const el = $('pj-error'); el.textContent = e.message || '載入失敗'; show('pj-error', true); }
  }

  const reasonText = (codes) => {
    const map = {
      EMPIRICAL_EVIDENCE_REQUIRED: '研究問題要求實證證據',
      EXECUTABLE_RECIPE_NOT_FOUND: '目前沒有可執行的實驗方案',
      RECIPE_CONTRACT_INVALID: '實驗方案契約不完整',
      DATA_CONTRACT_MISSING: '缺少資料契約',
      ORACLE_CONTRACT_MISSING: '缺少判定標準',
      EVALUATION_CONTRACT_MISSING: '缺少評估契約',
    };
    return (codes || []).map((code) => map[code] || code).join('；') || '需要人工確認客製實驗內容';
  };

  async function loadAdmin() {
    const resp = await window.paperLab.apiFetch('/api/admin/custom-experiments');
    if (resp.status === 401 || resp.status === 403) { show('pj-admin', false); return; }
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || `HTTP ${resp.status}`);
    const { requests } = await resp.json();
    show('pj-admin', true);
    show('pj-admin-empty', !requests || !requests.length);
    $('pj-admin-list').innerHTML = (requests || []).map((p) => {
      const gate = p.capability_gate || {};
      const state = p.custom_experiment_state || 'pending';
      const decided = state !== 'pending';
      return `<article class="bg-white border border-red-200 rounded-xl p-5">
        <div class="flex flex-wrap items-start justify-between gap-3 mb-2">
          <div><h3 class="font-bold text-primary">${esc(gate.original_topic || p.title || p.id)}</h3>
          <div class="text-xs text-gray-400 font-mono">${esc(p.pipeline_job_id || p.id)}</div></div>
          <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-red-100 text-red-800">${esc(CUSTOM_LABEL[state] || state)}</span>
        </div>
        <p class="text-sm text-gray-700 mb-3">${esc(reasonText(gate.reason_codes))}</p>
        <p class="text-sm text-gray-500 mb-3">缺少：${esc((gate.missing_capabilities || []).join('、') || '待人工確認')}</p>
        ${decided ? `<p class="text-sm text-gray-600">備註：${esc(p.custom_experiment_decision_note || '—')}<br>原始 job 維持停止，不會自動重啟。</p>` : `
          <textarea id="custom-note-${esc(p.id)}" maxlength="1000" class="w-full border border-gray-300 rounded-lg p-3 text-sm mb-3" placeholder="選填：評估備註"></textarea>
          <div class="flex flex-wrap gap-3">
            <button onclick="PJ.decide('${esc(p.id)}','accepted_for_manual_assessment')" class="px-4 py-2 rounded-lg bg-secondary text-white font-bold">接受人工評估</button>
            <button onclick="PJ.decide('${esc(p.id)}','declined')" class="px-4 py-2 rounded-lg border border-red-300 text-red-700 font-bold">不受理</button>
          </div>`}
      </article>`;
    }).join('');
  }

  async function decide(id, decision) {
    if (decision === 'declined' && !confirm('確定將此客製實驗標記為不受理？原始 job 會維持停止。')) return;
    const note = $(`custom-note-${id}`)?.value || '';
    const resp = await window.paperLab.apiFetch(`/api/admin/custom-experiments/${encodeURIComponent(id)}/decision`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision, note }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);
    await Promise.all([load(), loadAdmin()]);
  }

  let inited = false;
  function render() {
    show('pj-loading', false);
    const pl = window.paperLab;
    if (!pl || !pl.user) { show('pj-guest', true); show('pj-app', false); show('pj-admin', false); return; }
    show('pj-guest', false); show('pj-app', true);
    if (!inited) {
      inited = true;
      load();
      loadAdmin().catch((e) => { const el = $('pj-error'); el.textContent = e.message || '管理清單載入失敗'; show('pj-error', true); });
    }
  }
  window.addEventListener('paperlab:tier-changed', render);
  window.addEventListener('paperlab:auth-changed', render);
  setTimeout(render, 300);
  return { load, decide };
})();
</script>
{{ end }}
