[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test
python_functions = test_*
addopts = -ra
markers =
    unit: fast isolated unit test (no network, no subprocess)
    integration: cross-module / FastAPI service test
    e2e: end-to-end against the job service over frozen fixtures (gated)
    slow: long-running (real ML / network-shaped); excluded from the fast lane
    fixtures: asserts a build-plan fixture exists and loads
filterwarnings =
    ignore::DeprecationWarning
